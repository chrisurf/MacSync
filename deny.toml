# cargo-deny policy (`make audit`, CI workflow "Dependencies").
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms MacSync is built for.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
# Fail on every RustSec advisory (vulnerabilities, unsound code) and on
# yanked crates. Unmaintained crates are reported for direct dependencies.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # Format: { id = "RUSTSEC-YYYY-NNNN", reason = "why this does not affect us" },
]

[licenses]
# Permissive licences only.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
