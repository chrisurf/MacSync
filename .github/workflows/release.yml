name: Release

# Runs on every push to main (= every merge). Creates a release only when the
# version in Cargo.toml has no tag yet: bump the version in a PR to release.
# Artefact: MacSync-<version>-arm64.pkg (Apple Silicon), installs into /Applications.
#
# Optional secrets for Developer ID signing and notarisation (without them the
# app is ad-hoc signed):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD   base64 .p12 with "Developer ID Application" and "Developer ID Installer"
#   MACOS_CODESIGN_IDENTITY, MACOS_INSTALLER_IDENTITY
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released – nothing to do" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-15 # Apple Silicon
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: make lint test

      - name: Import signing certificates (optional)
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          if [ -z "$P12" ]; then echo "no certificate – ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/build.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials macsync --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=macsync" >> "$GITHUB_ENV"
          fi

      - name: Build MacSync.app and installer
        run: make pkg

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Installation (Apple Silicon)

          1. \`MacSync-$VERSION-arm64.pkg\` laden und doppelklicken – installiert MacSync nach /Programme.
          2. Ist die App nicht von Apple notarisiert, meldet macOS „nicht verifiziert“: Systemeinstellungen → Datenschutz & Sicherheit → **Trotzdem öffnen**.
          3. MacSync startet mit einem Symbol in der Menüleiste und führt durch die Einrichtung.
          EOF
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/MacSync-$VERSION-arm64.pkg build/MacSync-$VERSION-arm64.pkg.sha256 \
            --target "$GITHUB_SHA" --title "MacSync $VERSION" --notes-file notes.md
