[workspace]
resolver = "2"
members = ["crates/core", "crates/fs", "crates/gitaware", "crates/store", "crates/engine", "crates/net", "crates/daemon", "crates/cli"]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2021"
repository = "https://github.com/chrisurf/RepoSync"

[workspace.dependencies]
reposync-core = { path = "crates/core" }
reposync-fs = { path = "crates/fs" }
reposync-gitaware = { path = "crates/gitaware" }
reposync-store = { path = "crates/store" }
reposync-engine = { path = "crates/engine" }
reposync-net = { path = "crates/net" }
reposync-daemon = { path = "crates/daemon" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
toml = "1"
blake3 = "1"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
xattr = "1"
filetime = "0.2"
reflink-copy = "0.1"
globset = "0.4"
unicode-normalization = "0.1"
libc = "0.2"
snow = "0.10"
spake2 = "0.4"
getrandom = "0.2"
zstd = "0.14"
notify = "8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
mdns-sd = "0.21"
if-addrs = "0.15"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
