[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrisurf/RepoSync"

[workspace.dependencies]
reposync-core = { path = "crates/core" }
reposync-fs = { path = "crates/fs" }
reposync-gitaware = { path = "crates/gitaware" }
reposync-store = { path = "crates/store" }
reposync-engine = { path = "crates/engine" }
reposync-net = { path = "crates/net" }
reposync-daemon = { path = "crates/daemon" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"
blake3 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
xattr = "1"
filetime = "0.2"
reflink-copy = "0.1"
globset = "0.4"
unicode-normalization = "0.1"
libc = "0.2"
snow = "0.9"
spake2 = "0.4"
rand = "0.8"
zstd = "0.13"
notify = "6"
sysinfo = { version = "0.30", default-features = false }
mdns-sd = "0.11"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
